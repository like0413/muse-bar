name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24.19.0
          cache: true
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate release inputs
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<Version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use the stable vX.Y.Z format. Received: $env:RELEASE_TAG"
          }

          $config = Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          if ($Matches.Version -ne $config.version) {
            throw "Tag version $($Matches.Version) does not match tauri.conf.json version $($config.version)."
          }
          if ($config.plugins.updater.pubkey -eq 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            throw 'Generate the Tauri updater signing key and commit its public key before releasing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'GitHub secret TAURI_SIGNING_PRIVATE_KEY is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing.'
          }

      - name: Check frontend
        run: vp check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Build and upload signed NSIS release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Muse Bar ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          tauriScript: vp exec tauri
          args: --bundles nsis

      - name: Enforce installer size budget
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -eq 0) {
            throw 'The Tauri build did not produce an NSIS installer.'
          }

          $maximumBytes = 100MB
          foreach ($installer in $installers) {
            $sizeMiB = [Math]::Round($installer.Length / 1MB, 2)
            "- $($installer.Name): $sizeMiB MiB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($installer.Length -gt $maximumBytes) {
              throw "$($installer.Name) is $sizeMiB MiB, exceeding the 100 MiB release budget."
            }
          }

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false
